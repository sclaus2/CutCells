# Builds the source distribution and the wheels for PyPI.
#
# - Pull requests that touch the packaging build the sdist and one wheel per
#   platform (Python 3.12), to catch packaging breakage early.
# - Tags `v*` build everything and publish to PyPI.
# - A manual run builds everything and can publish to TestPyPI.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so no token is stored. Add
# the publisher for this workflow and the environments `pypi` / `testpypi` on
# pypi.org / test.pypi.org first.

name: Wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - python/CMakeLists.txt
      - cpp/**
      - .github/workflows/wheels.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*
      - name: Install from the sdist and import
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c "import cutcells; print(cutcells.__file__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Build all wheels
        if: github.event_name != 'pull_request'
        uses: pypa/cibuildwheel@v4.3.5
      - name: Build one wheel
        if: github.event_name == 'pull_request'
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: cp312-*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
